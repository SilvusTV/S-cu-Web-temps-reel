upstream realtime {
  ip_hash;
  server app-a:3000;
  server app-b:3000;
}
server {
  listen 3000;
  server_tokens off;
  location / {
    proxy_pass http://realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 60s;
  }
}

