name: livraison-cluster
x-app: &app
  image: livraison-app:latest
  environment: &env
    JWT_SECRET: ${JWT_SECRET:?Lancez npm run setup}
    DEMO_PASSWORD: ${DEMO_PASSWORD:?Lancez npm run setup}
    DEMO_MODE: "true"
    SIMULATION: "true"
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    REDIS_URL: redis://redis:6379
  depends_on:
    redis: { condition: service_healthy }
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    # Redis reste sur le réseau interne ; aucune publication de port.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10
  app-a:
    <<: *app
    build: .
    environment: { <<: *env, INSTANCE: A }
  app-b:
    <<: *app
    environment: { <<: *env, INSTANCE: B }
  proxy:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app-a, app-b]

