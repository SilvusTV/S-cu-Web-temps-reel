name: livraison
services:
  app:
    build: .
    ports: ["127.0.0.1:3000:3000"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?Lancez npm run setup}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Lancez npm run setup}
      DEMO_MODE: "true"
      SIMULATION: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

